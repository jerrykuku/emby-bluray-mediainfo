name: Build and release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            platform: linux/arm64
          - runner: ubuntu-24.04-arm
            arch: armv7l
            platform: linux/arm/v7
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        if: matrix.arch == 'armv7l'
        with:
          platforms: arm
      - name: Check release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("src/Emby.BlurayMainTitle.csproj").findtext("./PropertyGroup/Version"))')
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta(\.[0-9]+)?)?$ ]]
          [[ "${GITHUB_REF_NAME%%-beta*}" == "v$version" ]]
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        if: runner.arch == 'X64'
        with:
          dotnet-version: '8.0.x'
      - name: Build and test the plugin
        if: runner.arch == 'X64'
        run: |
          dotnet run -c Release --project tests/emby_bluray_paths
          dotnet build -c Release src/Emby.BlurayMainTitle.csproj
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: runner.arch == 'X64'
        with:
          name: managed
          path: src/bin/Release/net6.0/Emby.BlurayMainTitle.dll
          if-no-files-found: error
      - name: Download the library sources
        run: |
          mkdir -p out/sources
          cd out/sources
          curl -fLsS --retry 3 -O https://download.videolan.org/pub/videolan/libbluray/1.5.0/libbluray-1.5.0.tar.xz
          curl -fLsS --retry 3 -O https://download.videolan.org/pub/videolan/libudfread/libudfread-1.2.0.tar.xz
          curl -fLsS --retry 3 -O https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz
      - name: Build the static helper
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$PLATFORM" -v "$PWD:/repo" -w /repo alpine:3.22 sh -ec '
            apk add --no-cache build-base pkgconf meson ninja
            sh src/build-static-helper.sh out/sources out/native
          '
          tar -C out/native -cf out/native.tar .
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-${{ matrix.arch }}
          path: out/native.tar
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: runner.arch == 'X64'
        with:
          name: sources
          path: out/sources/
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: out
      - name: Create the four release ZIPs
        run: |
          for arch in x86_64 aarch64 armv7l; do
            tar -C "out/native-$arch" -xf "out/native-$arch/native.tar"
            rm "out/native-$arch/native.tar"
          done
          curl -fLsS --retry 3 'https://git.musl-libc.org/cgit/musl/plain/COPYRIGHT?h=v1.2.5' -o out/sources/musl-COPYRIGHT
          curl -fLsS --retry 3 https://raw.githubusercontent.com/gcc-mirror/gcc/releases/gcc-14.2.0/COPYING.RUNTIME -o out/sources/COPYING.RUNTIME
          curl -fLsS --retry 3 https://raw.githubusercontent.com/gcc-mirror/gcc/releases/gcc-14.2.0/COPYING3 -o out/sources/COPYING3
          python3 tools/package-release.py out out/sources out/release
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-packages
          path: out/release/*.zip
          if-no-files-found: error

  verify:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            platform: linux/amd64
            variant: linux-x86_64-static
          - runner: ubuntu-24.04-arm
            arch: aarch64
            platform: linux/arm64
            variant: linux-arm64-static
          - runner: ubuntu-24.04-arm
            arch: armv7l
            platform: linux/arm/v7
            variant: linux-armhf-static
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        if: matrix.arch == 'armv7l'
        with:
          platforms: arm
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-packages
          path: out/release
      - name: Relink the helpers from the release ZIPs
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$PLATFORM" -v "$PWD:/repo:ro" -w /repo alpine:3.22 sh -ec '
            apk add --no-cache build-base unzip
            sh tools/verify-release.sh "$1" /repo/out/release
          ' sh "$ARCH"
      - name: Run the Blu-ray probe tests
        env:
          ARCH: ${{ matrix.arch }}
          VARIANT: ${{ matrix.variant }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg libfreetype-dev zlib1g-dev
          git clone --depth 1 --branch 2.7.0 https://github.com/justdan96/tsMuxer.git out/tsmuxer
          test "$(git -C out/tsmuxer rev-parse HEAD)" = f06ac394c55ccee1cb76ae54f4636532a2d10253
          cmake -S out/tsmuxer -B out/tsmuxer-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build out/tsmuxer-build --parallel 3
          curl -fLsS --retry 3 https://fate-suite.ffmpeg.org/mov/dovi-p7.mp4 -o out/dovi-p7.mp4
          echo '7e4b69c90f8b1ec8a284d2610ab465fded5751f34a50e56129bcf152d8943c79  out/dovi-p7.mp4' | sha256sum -c
          fixture_args=()
          if [[ "$ARCH" == armv7l ]]; then fixture_args=(--emby-fixtures out/fixtures); fi
          unzip -q out/release/*-"$VARIANT".zip -d out/install
          python3 src/test_probe.py out/install/*/plugins/bluray-main-title \
            --tsmuxer "$PWD/out/tsmuxer-build/tsMuxer/tsmuxer" --dovi-sample "$PWD/out/dovi-p7.mp4" "${fixture_args[@]}"
      - name: Verify the package on Emby 4.10.2.0 armhf
        if: matrix.arch == 'armv7l'
        run: |
          sudo apt-get install -y --no-install-recommends qemu-system-arm cpio
          curl -fLsS --retry 3 --max-time 180 \
            https://github.com/MediaBrowser/Emby.Releases/releases/download/4.10.2.0/emby-server-deb_4.10.2.0_armhf.deb \
            -o out/emby-armhf.deb
          curl -fLsS --retry 3 --max-time 120 \
            https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/armv7/netboot-3.22.0/vmlinuz-lts \
            -o out/vmlinuz-armv7
          curl -fLsS --retry 3 --max-time 120 \
            https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/armv7/netboot-3.22.0/initramfs-lts \
            -o out/initramfs-armv7
          sh tools/test-emby-armhf.sh out/emby-armhf.deb out/install/*/plugins out/fixtures \
            out/vmlinuz-armv7 out/initramfs-armv7

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-packages
          path: out/release
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -- out/release/*.zip
          test "$#" -eq 4
          if [[ "$GITHUB_REF_NAME" == *-beta* ]]; then
            set -- --prerelease "$@"
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "$@"
